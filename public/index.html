<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#111b21">
    <link rel="manifest" href="/manifest.json">
    <title>Chat WhatsApp Style</title>
    <style>
        :root {
            --wa-bg: #0b141a;
            --wa-panel: #111b21;
            --wa-header: #202c33;
            --wa-incoming: #202c33;
            --wa-outgoing: #005c4b;
            --wa-text: #e9edef;
            --wa-text-secondary: #8696a0;
            --wa-green: #00a884;
            --wa-input-bg: #2a3942;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--wa-bg);
            color: var(--wa-text);
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            height: 100%;
            max-width: 800px;
            max-height: 100vh;
            background-color: var(--wa-panel);
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        @media (min-width: 768px) {
            .chat-container {
                height: 90vh;
                border-radius: 12px;
                border: 1px solid rgba(255,255,255,0.08);
            }
        }

        /* Header Estilo WhatsApp */
        .chat-header {
            background-color: var(--wa-header);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .chat-avatar {
            width: 40px;
            height: 40px;
            background: var(--wa-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 1.1rem;
        }

        .chat-info h2 {
            font-size: 1rem;
            font-weight: 500;
            color: var(--wa-text);
        }

        .chat-info span {
            font-size: 0.75rem;
            color: var(--wa-text-secondary);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background-color: var(--wa-green);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--wa-green);
        }

        /* Corpo de Mensagens */
        #messages {
            flex: 1;
            list-style-type: none;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-color: #0b141a;
            background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 0);
            background-size: 24px 24px;
        }

        #messages::-webkit-scrollbar {
            width: 5px;
        }
        #messages::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }

        #messages li {
            padding: 8px 12px;
            background-color: var(--wa-incoming);
            border-radius: 7.5px;
            max-width: 75%;
            word-break: break-word;
            font-size: 0.9rem;
            box-shadow: 0 1px 0.5px rgba(0,0,0,0.3);
            position: relative;
        }

        .msg-name {
            font-size: 0.75rem;
            font-weight: bold;
            color: #f1f1f1;
            margin-bottom: 2px;
            display: block;
        }

        /* Rodapé / Input de Envio */
        #form {
            background-color: var(--wa-header);
            padding: 10px 16px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        input {
            background-color: var(--wa-input-bg);
            border: none;
            border-radius: 8px;
            padding: 12px 14px;
            color: var(--wa-text);
            font-size: 0.95rem;
            outline: none;
        }

        input::placeholder {
            color: var(--wa-text-secondary);
        }

        #inputName {
            width: 100px;
        }

        #inputMessage {
            flex: 1;
        }

        button {
            background-color: var(--wa-green);
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
            flex-shrink: 0;
        }

        button:active {
            transform: scale(0.92);
        }

        button svg {
            width: 18px;
            height: 18px;
            fill: white;
            transform: translateX(1px);
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Header estilo WhatsApp -->
        <div class="chat-header">
            <div class="chat-avatar">💬</div>
            <div class="chat-info">
                <h2>Chat Multiplayer</h2>
                <span><div class="online-dot"></div> <span id="onlineCount">1</span> pessoa(s) online</span>
            </div>
        </div>

        <!-- Lista de Mensagens -->
        <ul id="messages"></ul>

        <!-- Formulário de Envio -->
        <form id="form">
            <input id="inputName" placeholder="Nome" required autocomplete="off" />
            <input id="inputMessage" placeholder="Digite uma mensagem..." required autocomplete="off" />
            <button title="Enviar">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const form = document.getElementById('form');
        const inputName = document.getElementById('inputName');
        const inputMessage = document.getElementById('inputMessage');
        const messages = document.getElementById('messages');
        const onlineCount = document.getElementById('onlineCount');

        // Atualizar contador de online
        socket.on('stats', (data) => {
            onlineCount.textContent = data.activeUsers;
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (inputMessage.value && inputName.value) {
                const data = {
                    name: inputName.value,
                    message: inputMessage.value
                };
                socket.emit('chat message', data);
                inputMessage.value = '';
            }
        });

        socket.on('chat message', (data) => {
            const item = document.createElement('li');
            item.innerHTML = `<span class="msg-name">${data.name}</span>${data.message}`;
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        });

        // Registrar o Service Worker para suportar PWA e tela cheia mobile
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((reg) => console.log('Service Worker registrado!', reg))
                    .catch((err) => console.log('Erro ao registrar Service Worker:', err));
            });
        }
    </script>
</body>
</html>
