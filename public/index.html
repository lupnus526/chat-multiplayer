<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b141a">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="apple-touch-icon" href="/icon.png">
    <title>Chat Guilda WhatsApp Style</title>
    <style>
        :root {
            --wa-bg: #0b141a;
            --wa-panel: #111b21;
            --wa-header: #202c33;
            --wa-incoming: #202c33;
            --wa-outgoing: #005c4b;
            --wa-text: #e9edef;
            --wa-text-secondary: #8696a0;
            --wa-green: #00a884;
            --wa-input-bg: #2a3942;
            --wa-purple: #8b5cf6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }

        html, body {
            background-color: #0b141a !important;
            color: var(--wa-text);
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        /* Tela de Login */
        #loginScreen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--wa-panel);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .login-box {
            background: var(--wa-header);
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            text-align: center;
        }

        .login-box h2 { margin-bottom: 20px; color: var(--wa-green); }
        .login-box input {
            width: 100%;
            margin-bottom: 15px;
            background: var(--wa-input-bg);
            border: none;
            padding: 12px;
            border-radius: 8px;
            color: white;
            outline: none;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: var(--wa-green);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .login-error { color: #f87171; font-size: 0.85rem; margin-top: 10px; display: none; }

        /* Container Principal */
        .chat-container {
            width: 100%;
            height: 100%;
            max-width: 800px;
            max-height: 100vh;
            max-height: 100dvh;
            background-color: var(--wa-panel);
            display: none;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative;
        }

        @media (min-width: 768px) {
            .chat-container { height: 90vh; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); }
        }

        .chat-header {
            background-color: var(--wa-header);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
        }

        .header-left { display: flex; align-items: center; gap: 12px; }
        .chat-avatar { width: 40px; height: 40px; background: var(--wa-green); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; }
        .chat-info h2 { font-size: 1rem; font-weight: 500; }
        .chat-info span { font-size: 0.75rem; color: var(--wa-text-secondary); display: flex; align-items: center; gap: 5px; }
        .online-dot { width: 8px; height: 8px; background-color: var(--wa-green); border-radius: 50%; }

        .tabs-bar { display: flex; background-color: var(--wa-header); border-bottom: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; overflow-x: auto; }
        .tab-btn { flex: 1; padding: 10px 8px; background: none; border: none; color: var(--wa-text-secondary); font-weight: 600; font-size: 0.75rem; cursor: pointer; text-align: center; border-bottom: 2px solid transparent; white-space: nowrap; }
        .tab-btn.active { color: var(--wa-green); border-bottom: 2px solid var(--wa-green); }

        .chat-panel { flex: 1; display: none; flex-direction: column; height: 0; min-height: 0; }
        .chat-panel.active { display: flex; }

        .messages-list {
            flex: 1;
            list-style-type: none;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-color: #0b141a;
            min-height: 0;
        }

        .messages-list li {
            padding: 8px 12px;
            background-color: var(--wa-incoming);
            border-radius: 7.5px;
            max-width: 75%;
            word-break: break-word;
            font-size: 0.9rem;
            position: relative;
        }
        .msg-name { font-size: 0.75rem; font-weight: bold; color: #f1f1f1; margin-bottom: 2px; display: block; }

        .chat-form { background-color: var(--wa-header); padding: 10px 16px; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        input.msg-input { flex: 1; background-color: var(--wa-input-bg); border: none; border-radius: 8px; padding: 12px 14px; color: var(--wa-text); font-size: 0.95rem; outline: none; }
        select.msg-input { width: 130px; background-color: var(--wa-input-bg); border: none; border-radius: 8px; padding: 12px; color: var(--wa-text); font-size: 0.9rem; outline: none; }

        .send-btn { background-color: var(--wa-green); color: white; border: none; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .send-btn.guild-send { background-color: var(--wa-purple); }
        .send-btn svg { width: 18px; height: 18px; fill: white; transform: translateX(1px); }

        #popupOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 8, 12, 0.8); display: none; justify-content: center; align-items: center; z-index: 999; padding: 20px; }
        .popup-box { background: #111b21; border: 2px solid var(--wa-purple); width: 100%; max-width: 380px; padding: 24px; border-radius: 20px; text-align: center; }
        .popup-box h3 { color: #d8b4fe; margin-bottom: 8px; }
        .popup-box p { color: var(--wa-text-secondary); margin-bottom: 20px; }
        .popup-close-btn { background: var(--wa-purple); color: white; border: none; padding: 10px 20px; border-radius: 10px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="loginScreen">
        <div class="login-box">
            <h2>⚔️ Guild Login</h2>
            <form id="loginForm">
                <input type="text" id="loginUser" placeholder="Usuário" required autocomplete="off" />
                <input type="password" id="loginPass" placeholder="Senha" required />
                <button type="submit">Entrar no Chat</button>
                <div id="loginError" class="login-error">Usuário ou senha incorretos</div>
            </form>
        </div>
    </div>

    <!-- CHAT PRINCIPAL -->
    <div class="chat-container" id="mainChatContainer">
        <div class="chat-header">
            <div class="header-left">
                <div class="chat-avatar">⚔️</div>
                <div class="chat-info">
                    <h2 id="welcomeTitle">Guild Chat</h2>
                    <span><div class="online-dot"></div> <span id="onlineCount">1</span> online</span>
                </div>
            </div>
            <span id="userBadge" style="font-size: 0.8rem; background: var(--wa-input-bg); padding: 4px 8px; border-radius: 6px;"></span>
        </div>

        <div class="tabs-bar">
            <button class="tab-btn active" onclick="switchTab('general')">💬 Chat Geral</button>
            <button class="tab-btn" onclick="switchTab('guild')">🔥 Avisos Quest</button>
            <button class="tab-btn" onclick="switchTab('private')">📩 Diretas</button>
            <button class="tab-btn" onclick="switchTab('gb')">🏦 Banco GB</button>
        </div>

        <!-- Painel Chat Geral da Guilda -->
        <div id="generalPanel" class="chat-panel active">
            <ul id="messagesGeneral" class="messages-list"></ul>
            <form id="formGeneral" class="chat-form">
                <input id="inputMsgGen" class="msg-input" placeholder="Conversar com a guilda..." required autocomplete="off" />
                <button class="send-btn" title="Enviar"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg></button>
            </form>
        </div>

        <!-- Painel Avisos de Quest (Restrito a Admins) -->
        <div id="guildPanel" class="chat-panel">
            <ul id="messagesGuild" class="messages-list"></ul>
            <form id="formGuild" class="chat-form">
                <input id="inputMsgGuild" class="msg-input" placeholder="Aviso oficial da guilda..." required autocomplete="off" />
                <button class="send-btn guild-send" title="Enviar Alerta"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg></button>
            </form>
        </div>

        <!-- Painel Mensagens Diretas (Estilo WhatsApp) -->
        <div id="privatePanel" class="chat-panel">
            <ul id="messagesPrivate" class="messages-list"></ul>
            <form id="formPrivate" class="chat-form">
                <select id="selectReceiver" class="msg-input" required>
                    <option value="">Para quem?</option>
                    <option value="admin">admin</option>
                    <option value="alexandre">alexandre</option>
                    <option value="membro1">membro1</option>
                    <option value="membro2">membro2</option>
                </select>
                <input id="inputMsgPrivate" class="msg-input" placeholder="Mensagem privada..." required autocomplete="off" />
                <button class="send-btn" title="Enviar PV"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg></button>
            </form>
        </div>

        <!-- Painel Banco da Guilda (GB) -->
        <div id="gbPanel" class="chat-panel">
            <div style="padding: 20px; text-align: center; color: var(--wa-text); overflow-y: auto; flex: 1;">
                <h3 style="color: var(--wa-green); margin-bottom: 10px;">Controle de Doações (GB)</h3>
                <p style="font-size: 0.85rem; color: var(--wa-text-secondary); margin-bottom: 20px;">
                    Envie o print do histórico do correio. O sistema registrará os dados em código e apagará a imagem automaticamente.
                </p>
                <form id="formGb" style="display: flex; flex-direction: column; gap: 12px; max-width: 300px; margin: 0 auto;">
                    <input type="file" id="printFile" accept="image/*" required style="background: var(--wa-input-bg); padding: 10px; border-radius: 8px; color: white;" />
                    <button type="submit" style="background: var(--wa-green); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;">Enviar Print para o GB</button>
                </form>
                <div id="gbStatus" style="margin-top: 15px; font-size: 0.9rem; color: #34d399;"></div>
            </div>
        </div>

        <!-- Pop-up de Aviso -->
        <div id="popupOverlay">
            <div class="popup-box">
                <h3>⚔️ CONVOCAÇÃO DE QUEST</h3>
                <p id="popupText">A guilda vai puxar agora!</p>
                <button class="popup-close-btn" onclick="closePopup()">Entendido</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let socket;
        let currentUser = '';
        let currentRole = '';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUser').value.trim();
            const password = document.getElementById('loginPass').value.trim();

            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const result = await response.json();
            if (result.success) {
                currentUser = result.username;
                currentRole = result.role;

                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainChatContainer').style.display = 'flex';
                document.getElementById('userBadge').textContent = `${currentUser} (${currentRole.toUpperCase()})`;
                document.getElementById('welcomeTitle').textContent = `Guild Chat - ${currentUser}`;

                if (currentRole !== 'admin') {
                    document.getElementById('formGuild').style.display = 'none';
                    const li = document.createElement('li');
                    li.style.color = '#8696a0';
                    li.textContent = "Apenas administradores podem enviar avisos de quest aqui.";
                    document.getElementById('messagesGuild').appendChild(li);
                }

                socket = io();
                socket.emit('register-user-socket', currentUser);

                socket.on('stats', (data) => {
                    document.getElementById('onlineCount').textContent = data.activeUsers;
                });

                socket.on('chat message', (data) => {
                    const list = document.getElementById('messagesGeneral');
                    const item = document.createElement('li');
                    item.innerHTML = `<span class="msg-name">${data.name}</span>${data.message}`;
                    list.appendChild(item);
                    list.scrollTop = list.scrollHeight;
                });

                socket.on('guild alert', (data) => {
                    const list = document.getElementById('messagesGuild');
                    const item = document.createElement('li');
                    item.innerHTML = `<span class="msg-name" style="color: #c084fc;">[QUEST] ${data.name}</span>${data.message}`;
                    list.appendChild(item);
                    list.scrollTop = list.scrollHeight;

                    document.getElementById('popupText').textContent = `${data.name}: ${data.message}`;
                    document.getElementById('popupOverlay').style.display = 'flex';
                });

                socket.on('private message', (data) => {
                    const list = document.getElementById('messagesPrivate');
                    const item = document.createElement('li');
                    const label = data.sender === currentUser ? `Para: ${data.receiver}` : `De: ${data.sender}`;
                    item.style.background = '#182229';
                    item.innerHTML = `<span class="msg-name" style="color: #34d399;">[PV] ${label}</span>${data.message}`;
                    list.appendChild(item);
                    list.scrollTop = list.scrollHeight;
                });

            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        });

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.chat-panel').forEach(p => p.classList.remove('active'));

            if (tab === 'general') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('generalPanel').classList.add('active');
            } else if (tab === 'guild') {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('guildPanel').classList.add('active');
            } else if (tab === 'private') {
                document.querySelectorAll('.tab-btn')[2].classList.add('active');
                document.getElementById('privatePanel').classList.add('active');
            } else if (tab === 'gb') {
                document.querySelectorAll('.tab-btn')[3].classList.add('active');
                document.getElementById('gbPanel').classList.add('active');
            }
        }

        document.getElementById('formGeneral').addEventListener('submit', (e) => {
            e.preventDefault();
            const msg = document.getElementById('inputMsgGen').value;
            if (msg) {
                socket.emit('chat message', { name: currentUser, message: msg });
                document.getElementById('inputMsgGen').value = '';
            }
        });

        document.getElementById('formGuild').addEventListener('submit', (e) => {
            e.preventDefault();
            const msg = document.getElementById('inputMsgGuild').value;
            if (msg && currentRole === 'admin') {
                socket.emit('guild alert', { name: currentUser, message: msg });
                document.getElementById('inputMsgGuild').value = '';
            }
        });

        document.getElementById('formPrivate').addEventListener('submit', (e) => {
            e.preventDefault();
            const receiver = document.getElementById('selectReceiver').value;
            const msg = document.getElementById('inputMsgPrivate').value;
            if (msg && receiver) {
                socket.emit('private message', { sender: currentUser, receiver, message: msg });
                document.getElementById('inputMsgPrivate').value = '';
            }
        });

        document.getElementById('formGb').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('printFile');
            const statusDiv = document.getElementById('gbStatus');

            const formData = new FormData();
            formData.append('print', fileInput.files[0]);
            formData.append('username', currentUser);

            statusDiv.textContent = "Enviando e processando print...";

            const response = await fetch('/api/gb/depositar', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();
            if (result.success) {
                statusDiv.textContent = "✅ " + result.message;
                fileInput.value = '';
            } else {
                statusDiv.textContent = "❌ Erro ao processar o print.";
            }
        });

        function closePopup() {
            document.getElementById('popupOverlay').style.display = 'none';
        }
    </script>
</body>
</html>
